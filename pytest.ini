[pytest]
asyncio_mode = auto
testpaths = tests
# Wall-clock timeout per test (pytest-timeout).  Prevents tests from hanging
# indefinitely when a MAVLink peer does not respond.  Override per-test with
# @pytest.mark.timeout(N) for tests that legitimately need more time.
timeout = 120
timeout_method = thread
markers =
    client: GCS-side (client) tests — require a connected drone or paired server
    server: Drone-side (server) tests — require a connected GCS or paired client
    paired: Integration tests that run both sides; collected automatically when test_mission_server.py and test_mission_client.py are both in scope
    slow: Tests with long timeouts
    frames: Frame-type support matrix (probe each MAV_FRAME value per mission type)
# Live logging is opt-in, not forced on: pass --log-cli-level=INFO (as every
# example in README.md/CLAUDE.md does) to enable it for a given run. These two
# settings only take effect once that flag (or -o log_cli=true) turns cli
# logging on; they do not enable it by themselves.
log_cli_level = INFO
log_cli_format = %(message)s
