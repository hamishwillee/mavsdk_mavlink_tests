[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    client: GCS-side (client) tests — require a connected drone or paired server
    server: Drone-side (server) tests — require a connected GCS or paired client
    paired: Integration tests that run both sides; collected automatically when test_mission_server.py and test_mission_client.py are both in scope
    slow: Tests with long timeouts
    frames: Frame-type support matrix (probe each MAV_FRAME value per mission type)
log_cli = true
log_cli_level = INFO
log_cli_format = %(message)s
